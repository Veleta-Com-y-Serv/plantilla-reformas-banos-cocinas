  packs:
    activa: true
    antetitulo: Packs con precio
    titulo: Lo que más me piden, con precio de partida
    texto: "Cada casa es distinta: el precio final te lo doy después de medir. Pero así sabes por dónde empezamos."
    etiqueta_destacado: El más pedido
    cta: { texto: Pedir presupuesto, url: "/#presupuesto" }
    packs:
      - nombre: Baño completo
        texto: "Lo quito todo y lo dejo nuevo: azulejo, suelo, sanitarios, mueble y ducha o bañera."
        precio: "desde 6.900 €"
        incluye: "Retirada de escombros; Alicatado y solado; Plato de ducha o bañera; Mueble de lavabo y espejo; Fontanería y electricidad nuevas; Limpieza final"
        duracion: "8-10 días laborables"
        destacado: true
        detalle: |
          Es la reforma para cuando el baño ya no da más de sí: azulejos pasados, sanitarios cansados o una distribución que molesta cada mañana. Lo vacío por completo, repaso paredes y suelo y lo dejo listo para empezar de cero.

          Después llega lo que no se ve y más importa: fontanería y electricidad nuevas, impermeabilizado donde toca y alicatado y solado bien nivelados. Luego van el plato de ducha o la bañera, el mueble de lavabo con su espejo y la grifería, todo elegido contigo antes de empezar, sobre muestras reales.

          Trabajo yo mismo y con gente de confianza, protejo el portal y los pasillos y cada tarde dejo la obra barrida. Al terminar hago una limpieza final y repasamos juntos cada rincón. Recibes el precio por escrito antes de empezar y no cambia si no cambias tú el encargo.
      - nombre: Cocina completa
        texto: "Muebles a medida, encimera y una distribución pensada para cómo cocinas tú."
        precio: "desde 9.500 €"
        incluye: "Diseño en 3D; Muebles a medida; Encimera de cuarzo o porcelánico; Alicatado o pintura; Instalación de electrodomésticos; Luz bajo muebles"
        duracion: "3 semanas"
        destacado: false
        detalle: |
          Una cocina se usa todos los días y por eso merece pensarse bien. Empiezo por preguntarte cómo cocinas, cuántos sois en casa y qué te estorba hoy, y con eso dibujo la distribución en 3D para que veas el resultado antes de comprar nada.

          Los muebles se hacen a medida para aprovechar cada hueco, con la encimera que mejor encaje contigo, de cuarzo o porcelánico. Me encargo del alicatado o de la pintura, de la instalación eléctrica y de fontanería, y de colocar los electrodomésticos. La luz bajo los muebles remata el trabajo y se agradece cada noche.

          Te explico cada fase, los plazos y qué decisiones te tocan en cada momento, para que no haya sorpresas. La obra queda protegida y limpia, y al final revisamos juntos puertas, cajones y encimera hasta que todo esté a tu gusto.
      - nombre: Cambio de bañera por ducha
        texto: "Fuera la bañera y en su sitio un plato extraplano con mampara. Sin tocar el resto del baño."
        precio: "desde 1.490 €"
        incluye: "Retirada de la bañera; Plato extraplano antideslizante; Mampara de vidrio; Azulejo de reposición; Grifería termostática"
        duracion: "1 día"
        destacado: false
        detalle: |
          Pensado para quien ya no quiere pasar por encima del borde de la bañera: personas mayores, familias con prisa por las mañanas o quien simplemente prefiere una ducha amplia. Se cambia solo lo necesario y el resto del baño se queda como está.

          Retiro la bañera, preparo la base y coloco un plato extraplano antideslizante con su mampara de vidrio y una grifería termostática que mantiene la temperatura. Reparo el azulejo de la zona con material de reposición para que la pared quede uniforme y sin parches a la vista.

          Es una obra rápida y ordenada: se hace en una sola jornada, con la zona protegida y los escombros fuera de casa al terminar. Puedes volver a ducharte esa misma noche, tras el tiempo de secado que te indico, y te dejo por escrito las pautas de cuidado.

