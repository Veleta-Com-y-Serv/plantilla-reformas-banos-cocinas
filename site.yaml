      - { titulo: Cocina lineal de alquiler, tipo: Cocina, lugar: Navalcarnero, texto: "Reforma rápida y resistente para un piso que se alquila: muebles blancos y encimera compacta.", imagen: /fotos/trabajo-cocina-navalcarnero.jpg }

