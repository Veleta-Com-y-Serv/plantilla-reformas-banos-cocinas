  zonas:
    activa: true
    titulo_pagina: "Reformas de baños y cocinas en {zona}"
    antetitulo: Dónde trabajo
    titulo: Móstoles y el sur de Madrid
    texto: "Vivo en Móstoles y trabajo a menos de media hora en coche. Si tu pueblo no está, pregúntame."
    items:
      - titulo: Móstoles
        texto: "Es mi casa y donde más obras he hecho: pisos de los setenta y ochenta con baños pequeños y cocinas cerradas que piden aire. Conozco bien las comunidades del municipio y sus normas de obras, así que aviso a los vecinos y organizo horarios para molestar lo menos posible. Trabajo también en los barrios cercanos y en los pueblos de alrededor. Si vives por aquí, la visita para medir y calcular el presupuesto la hago encantado."
      - titulo: Alcorcón
        texto: "En Alcorcón reformo sobre todo cocinas de piso que se abren al salón y baños que necesitan más luz y mejor aprovechamiento del espacio. Muchas viviendas son de la misma época y tienen instalaciones parecidas, de modo que sé de antemano qué suele aparecer al abrir la pared. Voy a medir sin coste, te propongo opciones y, si te encaja, te dejo el precio por escrito. También atiendo a vecinos de Móstoles y Leganés."
      - titulo: Fuenlabrada
        texto: "Aquí tengo muchos encargos de cambio de bañera por ducha para familias que quieren un baño más cómodo y seguro, además de reformas completas de aseos y cocinas. Es una obra limpia y rápida en la que cuido cada detalle de la protección del portal y de los pasillos. Atiendo Fuenlabrada y los municipios que la rodean, y te explico con calma qué se puede hacer según el estado de tu baño actual."
      - titulo: Villaviciosa de Odón
        texto: "En Villaviciosa de Odón abundan las casas con cocinas amplias y mucho uso familiar, donde un buen diseño marca la diferencia. Me encargo de pensar la distribución, de fabricar los muebles a medida y de coordinar la instalación completa, con una mesa o un office si hay sitio. Trabajo también en Boadilla del Monte y en Alcorcón, y voy a ver tu casa antes de preparar el presupuesto cerrado."
      - { titulo: Arroyomolinos }
      - titulo: Navalcarnero
        texto: "Navalcarnero tiene muchas viviendas que se alquilan o que cambian de inquilinos, y allí hago reformas rápidas y resistentes, con materiales fáciles de limpiar y que aguantan el uso diario. También reformo cocinas y baños de casas de familia que quieren renovarse por completo. Cubro Navalcarnero y los pueblos de alrededor, como Arroyomolinos o Humanes de Madrid, y te atiendo con visita de medición gratuita."
      - { titulo: Leganés }
      - { titulo: Boadilla del Monte }
      - { titulo: Humanes de Madrid }
      - { titulo: Moraleja de Enmedio }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen de mi trabajo
    testimonios:
      - { texto: "Nos dio un precio y fue el precio. Terminó el baño en nueve días y cada tarde dejaba todo barrido. No parecía que hubiera habido obra.", autor: Marisa y Javier, nota: "Baño completo, Móstoles" }
      - { texto: "Mi madre ya no podía entrar en la bañera. Rubén vino por la mañana y por la noche ya se estaba duchando.", autor: Alberto G., nota: "Cambio de bañera por ducha, Fuenlabrada" }
      - { texto: "Nos ayudó a elegir los muebles con un dibujo en 3D. La cocina es exactamente como la imaginamos.", autor: Nerea L., nota: "Cocina completa, Alcorcón" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que me preguntáis antes de empezar
    preguntas:
      - { pregunta: "¿Cuánto cuesta reformar un baño?", respuesta: "Depende de los metros y de los materiales. El pack de baño completo tiene un precio de partida; después de medir te doy el precio cerrado por escrito y no cambia." }
      - { pregunta: "¿Cuánto tiempo estaré sin baño o sin cocina?", respuesta: "Un baño completo, entre ocho y diez días laborables; una cocina, unas tres semanas. Un cambio de bañera por ducha se hace en un día." }
      - { pregunta: "¿Necesito licencia del ayuntamiento?", respuesta: "Para una reforma interior suele bastar con una comunicación previa. Te digo qué hace falta en tu municipio y lo presento yo." }
      - { pregunta: "¿Puedo elegir yo los materiales?", respuesta: "Claro. Te llevo muestras a casa y te acompaño a la exposición si quieres. Si ya tienes los azulejos, los coloco yo." }
      - { pregunta: "¿Qué pasa con los escombros y el polvo?", respuesta: "Protejo suelos y muebles, cierro la zona de obra y saco los escombros cada día. El último día lo dejo todo limpio." }
      - { pregunta: "¿La obra tiene garantía?", respuesta: "Sí, dos años de garantía por escrito en la mano de obra, además de la del fabricante en sanitarios, grifos y muebles." }

