secciones:
  hero:
    activa: true
    antetitulo: Baños y cocinas en Móstoles
    titulo: Tu baño nuevo, sin sorpresas en la factura
    texto: "Soy Rubén y llevo quince años reformando baños y cocinas en el sur de Madrid. Voy a medir sin coste, te doy un precio cerrado y la obra la llevo yo de principio a fin."
    imagen: /fotos/hero.jpg
    destacado: { titulo: "Soy Rubén, y la obra la hago yo", texto: "Sin subcontratas que cambian cada semana: un solo teléfono, el mío." }
    cta: { texto: Pide presupuesto gratis, url: "/#presupuesto" }
    cta_secundario: { texto: Ver trabajos hechos, url: "/#trabajos" }
    items:
      - { titulo: Precio cerrado por escrito, icono: documento }
